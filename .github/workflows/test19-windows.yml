name: OpenTzar TEST19 - Windows x64
on:
  push:
    paths:
      - OpenTzar_TEST19_CMD_ZRODLA.zip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opentzar-test19
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Extract TEST19
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath OpenTzar_TEST19_CMD_ZRODLA.zip -DestinationPath build19 -Force
          if (!(Test-Path build19/src/Cargo.toml)) { throw 'Missing TEST19 source tree' }
      - name: Install Rust MSVC
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build19/src/target
          key: test19-windows-msvc-1.99-${{ hashFiles('build19/src/Cargo.lock') }}
      - name: Build Windows executable
        working-directory: build19/src
        run: cargo +1.99.0-x86_64-pc-windows-msvc build --locked --release --bin retzar
      - name: Prepare and check player ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path player19 | Out-Null
          Copy-Item build19/src/target/release/retzar.exe player19/OpenTzar.exe
          Copy-Item build19/LICENSE.txt,build19/CHECKLISTA_TEST19.html,build19/PODGLAD_IKON_TEST19.png player19/
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "OpenTzar.exe" exit /b 1
          start "" /wait "%~dp0OpenTzar.exe" --ot-check-assets
          if errorlevel 1 (pause & exit /b 1)
          start "" /wait "%~dp0OpenTzar.exe" --root "%~dp0." --skip-intro --screen Random
          if errorlevel 1 pause
          '@ | Set-Content player19/START_SLOWIANIE.cmd -Encoding ascii
          'Rozpakuj ZIP do nowego folderu, uruchom START_SLOWIANIE.cmd i wskaz legalna instalacje Tzara. Nie wymaga Rust ani Studio. Wersja testowa; test rozgrywki nie zostal wykonany.' | Set-Content player19/CZYTAJ.txt -Encoding utf8
          Push-Location player19
          $p = Start-Process -FilePath '.\OpenTzar.exe' -ArgumentList '--ot-check-assets' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path runtime-art-v1.ok)) { throw 'Asset check failed' }
          Remove-Item runtime-art-v1.ok -Force
          Pop-Location
          Compress-Archive -Path player19/* -DestinationPath OpenTzar_TEST19_Windows_x64.zip -Force
          Get-FileHash OpenTzar_TEST19_Windows_x64.zip -Algorithm SHA256 | Format-List | Out-File SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTzar_TEST19_Windows_x64
          path: |
            OpenTzar_TEST19_Windows_x64.zip
            SHA256.txt
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "test19-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create $tag OpenTzar_TEST19_Windows_x64.zip OpenTzar_TEST19_CMD_ZRODLA.zip SHA256.txt --target "${{ github.sha }}" --title "OpenTzar TEST19 - Windows x64" --prerelease --notes "Prywatny test. Gotowy EXE, bez Studio i Rust. Wymaga oryginalnego Tzara. Kontrola zasobow automatyczna, rozgrywka niezweryfikowana. Nie upubliczniac przed audytem praw do zasobow."
